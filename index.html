<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Mirror</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .btn {
      padding: 9px 18px;
      background: rgba(0, 0, 0, 0.5);
      color: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.02em;
      backdrop-filter: blur(12px);
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .btn.active {
      background: rgba(6, 255, 165, 0.2);
      border-color: rgba(6, 255, 165, 0.6);
      color: #06ffa5;
    }

    #status {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      pointer-events: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      font-size: 17px;
      gap: 12px;
      z-index: 20;
    }

    #loading-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.45);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: rgba(6,255,165,0.8);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #hint {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    #bgPicker {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      background: none;
      cursor: pointer;
      padding: 2px;
      backdrop-filter: blur(12px);
    }
    #bgPicker::-webkit-color-swatch-wrapper { padding: 0; border-radius: 8px; }
    #bgPicker::-webkit-color-swatch { border: none; border-radius: 8px; }

    #depthIP {
      width: 100%;
      padding: 7px 10px;
      background: rgba(0,0,0,0.4);
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      font-size: 12px;
      backdrop-filter: blur(12px);
      outline: none;
    }
    #depthIP::placeholder { color: rgba(255,255,255,0.3); }
    #depthIP:focus { border-color: rgba(76,201,240,0.6); }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="ui">
    <button class="btn" id="debugBtn">Debug Skeleton</button>
    <button class="btn" id="addBtn">+ Add Objects</button>
    <button class="btn" id="clearBtn">Clear Objects</button>
    <div class="btn-row">
      <button class="btn" id="bgBtn" style="flex:1">Replace Background</button>
      <input type="color" id="bgPicker" value="#00ff88" title="Background color" />
    </div>
    <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; display:flex; flex-direction:column; gap:6px;">
      <input id="depthIP" type="text" value="localhost" placeholder="localhost  (USB via iproxy)" autocomplete="off" spellcheck="false" />
      <button class="btn" id="depthBtn">Connect Depth Camera</button>
    </div>
  </div>

  <div id="status">Initializing...</div>
  <div id="hint">Pinch to grab objects &nbsp;|&nbsp; Move your body to push them</div>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-msg">Loading AI models...</div>
    <div id="loading-sub">First load downloads ~10 MB of model weights</div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
